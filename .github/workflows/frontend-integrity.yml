name: Frontend integrity (locked dependencies)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact lockfile dependencies (no upgrades)
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
